[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "perfectclone"
dynamic = ["version"]
description = "Clone any website 1:1 with a real browser, then edit it safely."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Eshaan Gulati" }]
requires-python = ">=3.9"
dependencies = ["playwright>=1.40"]
keywords = ["website cloner", "clone website", "website copier", "website mirror", "playwright", "nextjs", "httrack alternative", "web scraping"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
    "Topic :: Software Development :: Build Tools",
]

[project.urls]
Homepage = "https://github.com/eshaangulati123/perfectclone-website-cloner"
Issues = "https://github.com/eshaangulati123/perfectclone-website-cloner/issues"
Changelog = "https://github.com/eshaangulati123/perfectclone-website-cloner/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest", "pillow", "ruff"]

[project.scripts]
perfectclone = "perfectclone.cli:main"

[tool.setuptools.dynamic]
version = { attr = "perfectclone.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
