name: Bug report
description: A site didn't clone correctly, or a command failed
labels: [bug]
body:
  - type: input
    id: url
    attributes:
      label: Site URL
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      placeholder: perfectclone clone https://example.com
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What looked or behaved differently from the live site? Screenshots help.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: The command's output, and the `failures` / `skipped` parts of manifest.json.
      render: text
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "macOS 15, Python 3.12, perfectclone 0.1.0"
    validations:
      required: true
