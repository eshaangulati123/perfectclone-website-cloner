name: Feature request
description: Suggest a feature or framework to support
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
  - type: input
    id: example
    attributes:
      label: Example site (optional)
